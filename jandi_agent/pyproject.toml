[project]
name = "jandi-agent"
version = "1.0.0"
description = "JANDI - Personal shopping assistant for users"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.1.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "uvicorn>=0.20.0",
    "starlette>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
